name: New Feature Request
description: Suggest something new, like a new tool or a new option.
title: "[New Feature]: "
labels: ["New Feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Explaining the problem it solves helps more than describing the solution.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      description: Please look through the existing issues first.
      options:
        - label: I have searched the existing issues and couldn't find this one.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: What is it for?
      options:
        - A new tool
        - Crunchyroll Importer
        - Mass Deleter
        - Web page
        - Starting it (the run folder)
        - Command line
        - Docs
        - Something else
      default: 0
    validations:
      required: true

  - type: textarea
    id: what-and-why
    attributes:
      label: What should it do, and why?
      description: What would you use it for? What's hard or slow today without it?
      placeholder: When I upload a season I have to... It would help if...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots, sketches or examples (optional)
      description: Anything that helps show the idea. Drag images in here.

  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)

  - type: input
    id: discord
    attributes:
      label: Discord username (optional)
      description: Add it if you're happy to be contacted about this.
      placeholder: "@username"
